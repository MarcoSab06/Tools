<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan & Pénibilité Estivale</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; max-width: 900px; margin: auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .year-selector { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; background: #0f172a; padding: 10px; border-radius: 8px; }
        input[type="date"] { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px; border-radius: 6px; }
        button.btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .chart-container { height: 250px; width: 100%; margin-bottom: 30px; }
        table { width: 100%; font-size: 0.7rem; border-collapse: collapse; }
        th, td { padding: 5px; border-bottom: 1px solid #334155; text-align: center; }
    </style>
</head>
<body>

    <h1>🌡️ Pénibilité Estivale</h1>
    
    <div class="card">
        <strong>Période & Lieu :</strong>
        <div class="controls">
            <div><label>Début : </label><input type="date" id="date-start" value="2026-06-01"></div>
            <div><label>Fin : </label><input type="date" id="date-end" value="2026-08-31"></div>
        </div>
        <input type="text" id="search-input" value="Valbonne" style="width: 100%; margin-bottom: 10px;">
        <button class="btn-action" onclick="lancerAnalyse()">Calculer le bilan sur la période 🚀</button>
    </div>

    <div class="card" id="selector-card" style="display:none;">
        <strong>Sélectionner les années à comparer :</strong>
        <div class="year-selector" id="year-checks"></div>
    </div>

    <div class="card" id="results-card" style="display:none;">
        <div id="resultats-content"></div>
        <div class="chart-container"><canvas id="multiMinChart"></canvas></div>
        <div class="chart-container"><canvas id="multiMaxChart"></canvas></div>
        <div class="chart-container"><canvas id="multiHumidexChart"></canvas></div>
    </div>

<script>
let globalDataStore = {};
let charts = {};

function calculerHumidex(t, td) {
    let e = 6.11 * Math.exp(5417.7530 * ((1 / 273.16) - (1 / (273.15 + td))));
    return Math.round((t + (5/9) * (e - 10)) * 10) / 10;
}

async function lancerAnalyse() {
    const annees = [2022, 2023, 2024, 2025, 2026];
    const dStart = document.getElementById("date-start").value;
    const dEnd = document.getElementById("date-end").value;
    
    document.getElementById("resultats-content").innerHTML = "Calcul en cours...";
    document.getElementById("results-card").style.display = "block";
    document.getElementById("selector-card").style.display = "block";
    
    let checksHtml = "";
    globalDataStore = {};

    for (let annee of annees) {
        // Ajuster la requête pour la période donnée
        let start = `${annee}-${dStart.split('-')[1]}-${dStart.split('-')[2]}`;
        let end = `${annee}-${dEnd.split('-')[1]}-${dEnd.split('-')[2]}`;
        
        // Validation basique
        if (new Date(start) > new Date()) continue;

        let url = `https://archive-api.open-meteo.com/v1/archive?latitude=43.64&longitude=7.0&hourly=temperature_2m,dew_point_2m&start_date=${start}&end_date=${end}&timezone=Europe%2FParis`;
        let res = await fetch(url);
        let json = await res.json();
        
        if (json.hourly) {
            processYear(annee, json);
            checksHtml += `<label><input type="checkbox" value="${annee}" checked onchange="updateCharts()"> ${annee}</label>`;
        }
    }
    document.getElementById("year-checks").innerHTML = checksHtml;
    updateCharts();
}

function processYear(annee, json) {
    let temps = json.hourly.temperature_2m;
    let dewPoints = json.hourly.dew_point_2m;
    let times = json.hourly.time;
    
    let dailyTMax = [], dailyTMin = [], dailyHMax = [];
    let currentMap = {};

    for(let i=0; i<temps.length; i++) {
        let date = times[i].split('T')[0];
        if(!currentMap[date]) currentMap[date] = {t: [], h: []};
        currentMap[date].t.push(temps[i]);
        currentMap[date].h.push(calculerHumidex(temps[i], dewPoints[i]));
    }
    
    Object.keys(currentMap).sort().forEach(d => {
        dailyTMax.push(Math.max(...currentMap[d]));
        dailyTMin.push(Math.min(...currentMap[d]));
        dailyHMax.push(Math.max(...currentMap[d].h));
    });

    globalDataStore[annee] = { tMax: dailyTMax, tMin: dailyTMin, hMax: dailyHMax };
}

function updateCharts() {
    let checked = Array.from(document.querySelectorAll('#year-checks input:checked')).map(i => i.value);
    
    const couleurs = {2022: '#94a3b8', 2023: '#38bdf8', 2024: '#34d399', 2025: '#fbbf24', 2026: '#f87171'};

    const createConfig = (dataKey, label) => ({
        type: 'line',
        data: {
            labels: Array.from({length: 92}, (_, i) => i+1),
            datasets: checked.map(y => ({
                label: y,
                data: globalDataStore[y][dataKey],
                borderColor: couleurs[y],
                borderWidth: 2,
                pointRadius: 0
            }))
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: label, color: '#fff' } } }
    });

    ['multiMinChart', 'multiMaxChart', 'multiHumidexChart'].forEach(id => {
        if(charts[id]) charts[id].destroy();
    });

    charts['multiMinChart'] = new Chart(document.getElementById('multiMinChart'), createConfig('tMin', 'Température Minimale'));
    charts['multiMaxChart'] = new Chart(document.getElementById('multiMaxChart'), createConfig('tMax', 'Température Maximale'));
    charts['multiHumidexChart'] = new Chart(document.getElementById('multiHumidexChart'), createConfig('hMax', 'Humidex Maximal'));
}
</script>
</body>
</html>
