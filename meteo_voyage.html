<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo de Voyage - Slovénie & Croatie Août 2026</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; max-width: 900px; margin: auto; }
        h1 { font-size: 1.4rem; text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #38bdf8; }
        .card.loading { border-left-color: #fbbf24; }
        .card.error { border-left-color: #f87171; }
        .header-line { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 8px; }
        .date { font-weight: bold; color: #38bdf8; font-size: 1.05rem; }
        .location { font-weight: bold; color: #f8fafc; font-size: 1rem; background: #334155; padding: 2px 8px; border-radius: 6px; }
        .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 0.85rem; margin-top: 8px; background: #0f172a; padding: 10px; border-radius: 8px; }
        .route-info { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; font-style: italic; }
        button.btn-refresh { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 20px; }
        button.btn-refresh:hover { background: #0ea5e9; }
        .footer { text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 30px; }
    </style>
</head>
<body>

    <h1>🚗 Météo en Direct - Road Trip Slovénie & Croatie</h1>
    <div class="subtitle">Suivi météorologique automatisé jour par jour (Août 2026)</div>

    <button class="btn-refresh" onclick="chargerMeteo()">Actualiser les prévisions météo 🔄</button>

    <div id="timeline"></div>

    <div class="footer">
        Données météo fournies par Open-Meteo.com | Itinéraire extrait de la feuille de route officielle.
    </div>

<script>
// Liste des étapes extraites de votre feuille de route avec coordonnées GPS approximatives
const etapes = [
    { date: "2026-08-16", lieu: "Vérone (Italie)", lat: 45.4384, lon: 10.9916, route: "Biot ➔ Vérone (Étape de liaison)" },
    { date: "2026-08-17", lieu: "Kobarid (Slovénie)", lat: 46.2486, lon: 13.5814, route: "Vérone ➔ Kobarid (Vallée de la Soča)" },
    { date: "2026-08-18", lieu: "Lac de Bohinj", lat: 46.2764, lon: 13.8864, route: "Kobarid ➔ Lac de Bohinj (Baignade / Paddle)" },
    { date: "2026-08-19", lieu: "Lac de Bohinj", lat: 46.2764, lon: 13.8864, route: "Journée autour de Bohinj / Bled / Ljubljana" },
    { date: "2026-08-20", lieu: "Lacs de Plitvice (Croatie)", lat: 44.8808, lon: 15.6160, route: "Bohinj ➔ Plitvice (Randonnée passerelles)" },
    { date: "2026-08-21", lieu: "Parc de Krka / Split", lat: 43.8047, lon: 15.9614, route: "Plitvice ➔ Krka ➔ Embarquement Ferry Split pour Hvar" },
    { date: "2026-08-22", lieu: "Île de Hvar", lat: 43.1729, lon: 16.4411, route: "Séjour Hvar - Plage & Détente" },
    { date: "2026-08-23", lieu: "Île de Hvar (Sveta Nedjelja)", lat: 43.1492, lon: 16.6631, route: "Séjour Hvar - Escalade Cliffbase & Exploration" },
    { date: "2026-08-24", lieu: "Île de Hvar (Hvar Town)", lat: 43.1729, lon: 16.4411, route: "Séjour Hvar - Autonomie ados / Hula Hula" },
    { date: "2026-08-25", lieu: "Île de Hvar", lat: 43.1729, lon: 16.4411, route: "Séjour Hvar - Farniente / Criques" },
    { date: "2026-08-26", lieu: "Île de Hvar", lat: 43.1729, lon: 16.4411, route: "Séjour Hvar - Activités nautiques" },
    { date: "2026-08-27", lieu: "Île de Hvar", lat: 43.1729, lon: 16.4411, route: "Séjour Hvar - Dernière journée sur l'île" },
    { date: "2026-08-28", lieu: "Dubrovnik", lat: 42.6507, lon: 18.0944, route: "Hvar ➔ Dubrovnik (Descente de la côte dalmate)" },
    { date: "2026-08-29", lieu: "Duino (Italie / Nord Adriatique)", lat: 45.7728, lon: 13.6342, route: "Dubrovnik ➔ Duino (Remontée de liaison)" },
    { date: "2026-08-30", lieu: "Biot (Retour)", lat: 43.6412, lon: 7.0084, route: "Duino ➔ Biot (Fin du road trip)" }
];

async function chargerMeteo() {
    const container = document.getElementById("timeline");
    container.innerHTML = "<div style='text-align:center; color:#38bdf8;'>Interrogation des prévisions météo en cours...</div>";

    let html = "";
    const todayStr = new Date().toISOString().split('T')[0];

    for (let i = 0; i < etapes.length; i++) {
        let etape = etapes[i];
        let cardId = `etape-${i}`;
        
        // Vérifier si la date est dans le futur ou passé récent par rapport aux prévisions open-meteo (qui gèrent 16 jours max en prévision)
        let isPast = etape.date < todayStr;
        
        // Construction de l'URL Open-Meteo (prévision ou archive selon la date)
        let url = `https://api.open-meteo.com/v1/forecast?latitude=${etape.lat}&longitude=${etape.lon}&daily=temperature_2m_max,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max,sunshine_duration&timezone=Europe%2FBerlin&start_date=${etape.date}&end_date=${etape.date}`;

        let meteoData = { tMax: "--", tMin: "--", precip: "--", proba: "--", vent: "--", soleil: "--" };

        try {
            let res = await fetch(url);
            let json = await res.json();
            if (json.daily && json.daily.temperature_2m_max) {
                meteoData.tMax = json.daily.temperature_2m_max[0] ?? "--";
                meteoData.tMin = json.daily.temperature_2m_min[0] ?? "--";
                meteoData.precip = json.daily.precipitation_sum[0] ?? 0;
                meteoData.proba = json.daily.precipitation_probability_max ? json.daily.precipitation_probability_max[0] + "%" : "N/C";
                meteoData.vent = json.daily.windspeed_10m_max ? Math.round(json.daily.windspeed_10m_max[0]) + " km/h" : "N/C";
                let sunshineSec = json.daily.sunshine_duration ? json.daily.sunshine_duration[0] : 0;
                meteoData.soleil = Math.round(sunshineSec / 3600 * 10) / 10 + " h";
            }
        } catch(e) {
            console.error("Erreur météo pour", etape.date, e);
        }

        html += `
            <div class="card">
                <div class="header-line">
                    <span class="date">📅 ${etape.date}</span>
                    <span class="location">📍 ${etape.lieu}</span>
                </div>
                <div class="route-info">${etape.route}</div>
                <div class="details-grid">
                    <div>🌡️ <strong>Max:</strong> ${meteoData.tMax} °C</div>
                    <div>❄️ <strong>Min:</strong> ${meteoData.tMin} °C</div>
                    <div>🌧️ <strong>Pluie:</strong> ${meteoData.precip} mm (${meteoData.proba})</div>
                    <div>💨 <strong>Vent max:</strong> ${meteoData.vent}</div>
                    <div>☀️ <strong>Soleil:</strong> ${meteoData.soleil}</div>
                </div>
            </div>
        `;
    }

    container.innerHTML = html;
}

// Charger automatiquement au démarrage
document.addEventListener("DOMContentLoaded", chargerMeteo);
</script>

</body>
</html>
