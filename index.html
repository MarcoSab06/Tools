<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Bivouac - Carte & Rosée</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; max-width: 680px; margin: auto; }
        h1 { font-size: 1.4rem; text-align: center; color: #38bdf8; margin-bottom: 10px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        input[type="date"] { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-size: 1rem; }
        #map { height: 220px; width: 100%; border-radius: 8px; margin-top: 10px; z-index: 1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; table-layout: fixed; }
        th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #334155; word-wrap: break-word; }
        th { color: #94a3b8; font-size: 0.75rem; }
        
        th:nth-child(1), td:nth-child(1) { width: 18%; }
        th:nth-child(5), td:nth-child(5) { width: 20%; }
        th:nth-child(6), td:nth-child(6) { width: 18%; }
        
        .badge-vert { color: #4ade80; font-weight: bold; }
        .badge-orange { color: #fbbf24; font-weight: bold; }
        .badge-rouge { color: #f87171; font-weight: bold; }
        
        .cloud-icon { font-size: 1.1rem; vertical-align: middle; margin-right: 2px; }
        .ciel-clair { color: #fbbf24; }
        .ciel-nuageux { color: #94a3b8; }
        .ciel-couvert { color: #64748b; }
        
        .spot-info { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }
        .meta-info { font-size: 0.8rem; color: #38bdf8; background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; }
    </style>
</head>
<body>

    <h1>⛺ Météo Bivouac & Fiabilité</h1>
    
    <div class="card">
        <strong>1. Choisissez votre spot sur la carte :</strong>
        <div id="map"></div>
        <div class="spot-info" id="spot-text">
            Lat/Lon : 43.7155, 6.9307 | Alt : 1325m
        </div>
    </div>

    <div class="card">
        <div class="controls">
            <label for="date-selection"><strong>2. Date :</strong></label>
            <input type="date" id="date-selection" onchange="chargerMeteo()">
        </div>
        
        <!-- Bloc d'indication de l'horizon et du modèle -->
        <div class="meta-info" id="meta-container">
            <span>Horizon : -</span>
            <span>Modèle : Open-Meteo (Best Match)</span>
        </div>

        <h3 style="margin: 10px 0; font-size: 1.1rem;">Prévisions Nuit (18h - 08h)</h3>
        <div id="resultats">Chargement des données...</div>
    </div>

<script>
let currentLat = 43.715454;
let currentLon = 6.930722;
let currentElevation = 1325;
let map, marker;

document.addEventListener("DOMContentLoaded", () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("date-selection").value = today;

    map = L.map('map').setView([currentLat, currentLon], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    marker = L.marker([currentLat, currentLon], {draggable: true}).addTo(map);

    marker.on('dragend', function(event) {
        let position = marker.getLatLng();
        currentLat = position.lat;
        currentLon = position.lng;
        recupererAltitudeEtMeteo();
    });

    map.on('click', function(event) {
        marker.setLatLng(event.latlng);
        currentLat = event.latlng.lat;
        currentLon = event.latlng.lng;
        recupererAltitudeEtMeteo();
    });

    chargerMeteo();
});

async function recupererAltitudeEtMeteo() {
    try {
        const response = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${currentLat}&longitude=${currentLon}`);
        const data = await response.json();
        if (data.elevation && data.elevation.length > 0) {
            currentElevation = Math.round(data.elevation[0]);
        }
    } catch (e) {
        console.log("Erreur récupération altitude");
    }
    document.getElementById("spot-text").innerText = `Lat/Lon : ${currentLat.toFixed(4)}, ${currentLon.toFixed(4)} | Alt : ${currentElevation}m`;
    chargerMeteo();
}

function getCielIcon(pourcentage) {
    if (pourcentage <= 10) return `<span class="cloud-icon ciel-clair">🌟</span> ${pourcentage}%`;
    if (pourcentage <= 50) return `<span class="cloud-icon ciel-nuageux">🌤️</span> ${pourcentage}%`;
    if (pourcentage <= 90) return `<span class="cloud-icon ciel-nuageux">☁️</span> ${pourcentage}%`;
    return `<span class="cloud-icon ciel-couvert">☁️</span> ${pourcentage}%`;
}

async function chargerMeteo() {
    const selectedDate = document.getElementById("date-selection").value;
    if (!selectedDate) return;

    const todayStr = new Date().toISOString().split('T')[0];
    const diffTime = new Date(selectedDate) - new Date(todayStr);
    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

    let horizonText = diffDays === 0 ? "Aujourd'hui" : `J+${diffDays}`;
    if (diffDays < 0) horizonText = "Passé / Archivé";

    document.getElementById("meta-container").innerHTML = `
        <span>Horizon : <strong>${horizonText}</strong></span>
        <span>Modèle : <strong>ECMWF / ICON (Best Match)</strong></span>
    `;

    let nextDateObj = new Date(selectedDate);
    nextDateObj.setDate(nextDateObj.getDate() + 1);
    const endDate = nextDateObj.toISOString().split('T')[0];

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&elevation=${currentElevation}&hourly=temperature_2m,dew_point_2m,cloud_cover,wind_speed_10m&start_date=${selectedDate}&end_date=${endDate}&models=best_match&timezone=Europe%2FParis`;
    
    document.getElementById("resultats").innerHTML = "Chargement...";

    try {
        const response = await fetch(url);
        const data = await response.json();
        
        let html = `<table><tr><th>Hre</th><th>T°</th><th>Rosée</th><th>Écart</th><th>Ciel</th><th>Vent</th><th>Risq</th></tr>`;
        let lignesAffichees = 0;

        for (let i = 0; i < data.hourly.time.length; i++) {
            let timeFull = data.hourly.time[i];
            let [datePart, timePart] = timeFull.split("T");
            let hourNum = parseInt(timePart.split(":")[0], 10);

            let isNightTime = (datePart === selectedDate && hourNum >= 18) || (datePart === endDate && hourNum <= 8);

            if (isNightTime) {
                let temp = data.hourly.temperature_2m[i];
                let dew = data.hourly.dew_point_2m[i];
                let wind = data.hourly.wind_speed_10m[i];
                let clouds = data.hourly.cloud_cover[i];
                let ecart = (temp - dew).toFixed(1);
                
                let risqueHtml = '<span class="badge-vert">Faible</span>';
                if (ecart > 5) {
                    risqueHtml = '<span class="badge-vert">Faible</span>';
                } else if (ecart > 3 && ecart <= 5) {
                    if (wind < 12 && clouds < 30) {
                        risqueHtml = '<span class="badge-orange">Modéré</span>';
                    } else {
                        risqueHtml = '<span class="badge-vert">Faible</span>';
                    }
                } else {
                    if (wind < 12 && clouds < 30) {
                        risqueHtml = '<span class="badge-rouge">ÉLEVÉ</span>';
                    } else {
                        risqueHtml = '<span class="badge-orange">Modéré</span>';
                    }
                }
                
                let displayHour = timePart.substring(0, 2) + 'h';

                html += `<tr>
                    <td>${displayHour}</td>
                    <td>${temp}°</td>
                    <td>${dew}°</td>
                    <td>${ecart}°</td>
                    <td style="font-size: 0.8rem;">${getCielIcon(clouds)}</td>
                    <td>${wind}</td>
                    <td style="font-size: 0.8rem;">${risqueHtml}</td>
                </tr>`;
                lignesAffichees++;
            }
        }
        
        if (lignesAffichees === 0) {
            html += `<tr><td colspan="7">Données non disponibles pour cette date.</td></tr>`;
        }

        html += `</table>`;
        document.getElementById("resultats").innerHTML = html;
    } catch (error) {
        document.getElementById("resultats").innerHTML = "Erreur lors du chargement météo.";
    }
}
</script>

</body>
</html>
